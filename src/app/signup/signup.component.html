<div class="container">
  <div class="col-md-6 offset-md-3 mt-3">
    <div class="card">
      <div class="card-header">Sign Up</div>
      <div class="card-body">
        <div class="text-danger" *ngIf="errorMessage">{{errorMessage}}</div>
        <form [formGroup]="userFormGroup" (ngSubmit)="handleSignUp()">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" formControlName="username" id="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" formControlName="password" id="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" formControlName="confirmPassword" id="confirmPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary" [disabled]="userFormGroup.invalid">Sign Up</button>
        </form>
      </div>
    </div>
  </div>
</div>
